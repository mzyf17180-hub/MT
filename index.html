<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MT ROLEPLAY - OFFICIAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --bg-main: #080a0f;
            --card-bg: rgba(15, 18, 28, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary-glow: #00f2fe;
            --accent-gold: #ffb700;
            --accent-purple: #7928ca;
            --tiktok-color: #ff0050;
            --discord-color: #5865F2;
            --roblox-color: #00a2ff;
            --text-main: #ffffff;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(121, 40, 202, 0.15) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(0, 242, 254, 0.12) 0%, transparent 45%),
                url('https://images.wallpapersden.com/image/download/gta-5-roleplay_bWdpbm2UmZqaraWkpJRmbmdlrWZlbWU.jpg');
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(8, 10, 15, 0.88);
            backdrop-filter: blur(12px);
            z-index: 0;
        }

        .wrapper {
            width: 100%;
            max-width: 680px;
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            text-align: center;
            padding: 10px 0;
        }

        .logo-box {
            position: relative;
            display: inline-block;
            margin-bottom: 12px;
        }

        .logo-avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 2px solid rgba(255, 183, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.8rem;
            color: var(--accent-gold);
            box-shadow: 0 0 30px rgba(255, 183, 0, 0.25);
            margin: 0 auto;
        }

        .season-tag {
            background: linear-gradient(90deg, var(--accent-purple), var(--primary-glow));
            color: #fff;
            font-size: 0.8rem;
            font-weight: 800;
            padding: 4px 16px;
            border-radius: 50px;
            display: inline-block;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            margin-bottom: 8px;
        }

        h1 {
            font-size: 2.4rem;
            font-weight: 900;
            letter-spacing: 1px;
            background: linear-gradient(180deg, #ffffff 30%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .glass-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 22px;
            padding: 22px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
        }

        .card-header-title {
            font-size: 1.05rem;
            font-weight: 800;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-main);
        }

        .timer-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            direction: ltr;
        }

        .time-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            padding: 12px 5px;
            text-align: center;
        }

        .time-box .num {
            font-size: 1.7rem;
            font-weight: 900;
            color: var(--primary-glow);
            text-shadow: 0 0 12px rgba(0, 242, 254, 0.4);
            display: block;
            line-height: 1.1;
        }

        .time-box .label {
            font-size: 0.75rem;
            color: var(--text-sub);
            margin-top: 4px;
            display: block;
        }

        .people-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 12px;
        }

        .person-card {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .person-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.03);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .person-icon-wrapper {
            width: 50px;
            height: 50px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            flex-shrink: 0;
        }

        .owner-icon {
            background: rgba(255, 183, 0, 0.1);
            color: var(--accent-gold);
            border: 1px solid rgba(255, 183, 0, 0.3);
            box-shadow: 0 0 15px rgba(255, 183, 0, 0.15);
        }

        .dev-icon {
            background: rgba(0, 242, 254, 0.1);
            color: var(--primary-glow);
            border: 1px solid rgba(0, 242, 254, 0.3);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.15);
        }

        .person-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .person-name {
            font-size: 1rem;
            font-weight: 800;
        }

        .person-role {
            font-size: 0.75rem;
            color: var(--text-sub);
        }

        .person-tag {
            font-size: 0.8rem;
            color: var(--primary-glow);
            font-weight: 600;
            direction: ltr;
            text-align: right;
            margin-top: 2px;
        }

        .actions-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .action-btn {
            width: 100%;
            padding: 16px 20px;
            border-radius: 16px;
            font-weight: 800;
            font-size: 1.05rem;
            text-decoration: none;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s ease;
            border: none;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .action-btn:hover {
            transform: translateY(-3px);
            filter: brightness(1.15);
        }

        .btn-tiktok {
            background: linear-gradient(135deg, #111, #ff0050);
            border: 1px solid rgba(255, 0, 80, 0.3);
        }

        .btn-discord {
            background: linear-gradient(135deg, #1e2238, var(--discord-color));
            border: 1px solid rgba(88, 101, 242, 0.3);
        }

        .btn-roblox {
            background: linear-gradient(135deg, #0052d4, #4364f7, #6fb1fc);
            border: 1px solid rgba(0, 162, 255, 0.4);
            box-shadow: 0 0 20px rgba(0, 162, 255, 0.3);
        }

        .btn-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-content i {
            font-size: 1.4rem;
        }

        .admin-gear {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(15, 18, 28, 0.9);
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 99;
            box-shadow: 0 0 15px rgba(255, 183, 0, 0.2);
        }

        .modal-bg {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-body {
            background: #0f121c;
            border: 1px solid var(--accent-gold);
            border-radius: 20px;
            width: 100%;
            max-width: 450px;
            padding: 25px;
        }

        .input-box {
            margin-bottom: 15px;
        }

        .input-box label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 6px;
        }

        .input-box input {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            color: #fff;
            outline: none;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <header>
            <div class="logo-box">
                <div class="logo-avatar">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
            </div>
            <div><span class="season-tag">SEASON 8 - السيزون الثامن</span></div>
            <h1>MT ROLEPLAY</h1>
        </header>

        <div class="glass-card" style="text-align: center;">
            <div class="card-header-title" style="justify-content: center; color: var(--accent-gold);">
                <i class="fa-solid fa-hourglass-half"></i>
                <span>الوقت المتبقي لافتتاح الماب</span>
            </div>
            <div class="timer-grid">
                <div class="time-box"><span class="num" id="d">00</span><span class="label">أيام</span></div>
                <div class="time-box"><span class="num" id="h">00</span><span class="label">ساعات</span></div>
                <div class="time-box"><span class="num" id="m">00</span><span class="label">دقائق</span></div>
                <div class="time-box"><span class="num" id="s">00</span><span class="label">ثواني</span></div>
            </div>
        </div>

        <div class="glass-card">
            <div class="card-header-title" style="color: var(--primary-glow);">
                <i class="fa-solid fa-users-gear"></i>
                <span>إدارة ومطوري السيرفر</span>
            </div>
            <div class="people-grid">
                <div class="person-card" onclick="openDiscordProfile('ka.55')">
                    <div class="person-icon-wrapper owner-icon">
                        <i class="fa-solid fa-crown"></i>
                    </div>
                    <div class="person-info">
                        <span class="person-name">عراب</span>
                        <span class="person-role">مالك السيرفر (الأونر)</span>
                        <span class="person-tag">@ka.55</span>
                    </div>
                </div>

                <div class="person-card" onclick="openDiscordProfile('9.9.9.9.5.09.')">
                    <div class="person-icon-wrapper dev-icon">
                        <i class="fa-solid fa-code"></i>
                    </div>
                    <div class="person-info">
                        <span class="person-name">فهد</span>
                        <span class="person-role">مطور الموقع والأنظمة</span>
                        <span class="person-tag">@9.9.9.9.5.09.</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="actions-grid">
            <a href="https://www.roblox.com/games/71656579951930/MT#!/game-instances" target="_blank" class="action-btn btn-roblox">
                <div class="btn-content">
                    <i class="fa-solid fa-gamepad"></i>
                    <span>مابنا🩵</span>
                </div>
                <i class="fa-solid fa-chevron-left"></i>
            </a>

            <a href="https://www.tiktok.com/@mtzcfw" target="_blank" class="action-btn btn-tiktok">
                <div class="btn-content">
                    <i class="fa-brands fa-tiktok"></i>
                    <span>التيك توك الرسمـي (@mtzcfw)</span>
                </div>
                <i class="fa-solid fa-chevron-left"></i>
            </a>

            <a id="discord-main-btn" href="https://discord.gg" target="_blank" class="action-btn btn-discord">
                <div class="btn-content">
                    <i class="fa-brands fa-discord"></i>
                    <span>سيرفر الديسكورد</span>
                </div>
                <i class="fa-solid fa-chevron-left"></i>
            </a>
        </div>
    </div>

    <button class="admin-gear" onclick="openDevPanel()"><i class="fa-solid fa-sliders"></i></button>

    <div class="modal-bg" id="dev-modal">
        <div class="modal-body">
            <h3 style="color: var(--accent-gold); margin-bottom: 15px;"><i class="fa-solid fa-gear"></i> إعدادات سريعة</h3>
            <div class="input-box">
                <label>تاريخ وقت الافتتاح:</label>
                <input type="datetime-local" id="in-date">
            </div>
            <div class="input-box">
                <label>رابط سيرفر الديسكورد:</label>
                <input type="text" id="in-discord" placeholder="https://discord.gg/xxx">
            </div>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button onclick="saveDevData()" style="flex: 1; padding: 12px; background: var(--accent-gold); color: #000; font-weight: 800; border: none; border-radius: 10px; cursor: pointer;">حفظ</button>
                <button onclick="closeDevPanel()" style="padding: 12px 20px; background: #333; color: #fff; border: none; border-radius: 10px; cursor: pointer;">إلغاء</button>
            </div>
        </div>
    </div>

    <script>
        let targetDate = localStorage.getItem('mt_target_date') || new Date(Date.now() + 172800000).toISOString().slice(0, 16);
        let discordUrl = localStorage.getItem('mt_discord_url') || 'https://discord.gg';

        document.getElementById('discord-main-btn').href = discordUrl;

        function runTimer() {
            const dest = new Date(targetDate).getTime();
            const now = new Date().getTime();
            const diff = dest - now;

            if (diff <= 0) {
                document.getElementById('d').innerText = '00';
                document.getElementById('h').innerText = '00';
                document.getElementById('m').innerText = '00';
                document.getElementById('s').innerText = '00';
                return;
            }

            document.getElementById('d').innerText = Math.floor(diff / (1000 * 60 * 60 * 24)).toString().padStart(2, '0');
            document.getElementById('h').innerText = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2, '0');
            document.getElementById('m').innerText = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
            document.getElementById('s').innerText = Math.floor((diff % (1000 * 60)) / 1000).toString().padStart(2, '0');
        }

        setInterval(runTimer, 1000);
        runTimer();

        function openDiscordProfile(username) {
            navigator.clipboard.writeText(username);
            alert(`تم نسخ يوزر الديسكورد: (${username})\nيمكنك الآن إضافته في الديسكورد مباشرة!`);
        }

        function openDevPanel() {
            const pwd = prompt("أدخل كلمة السر للتحكم:");
            if (pwd === "MT221") {
                document.getElementById('in-date').value = targetDate;
                document.getElementById('in-discord').value = discordUrl;
                document.getElementById('dev-modal').style.display = 'flex';
            } else if (pwd !== null) {
                alert("كلمة السر غير صحيحة!");
            }
        }

        function closeDevPanel() {
            document.getElementById('dev-modal').style.display = 'none';
        }

        function saveDevData() {
            targetDate = document.getElementById('in-date').value;
            discordUrl = document.getElementById('in-discord').value;

            localStorage.setItem('mt_target_date', targetDate);
            localStorage.setItem('mt_discord_url', discordUrl);

            document.getElementById('discord-main-btn').href = discordUrl;
            runTimer();
            closeDevPanel();
            alert("تم حفظ التعديلات بنجاح!");
        }
    </script>
</body>
</html>
